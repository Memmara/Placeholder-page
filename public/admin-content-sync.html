<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memmara Religious Studies sync</title><style>body{font:16px system-ui;background:#0b1224;color:#eef4ff;max-width:650px;margin:10vh auto;padding:20px}button{background:#ab96ff;border:0;border-radius:12px;padding:14px 22px;font:inherit;cursor:pointer}pre{white-space:pre-wrap;line-height:1.5}</style><h1>Sync Religious Studies</h1><p>Owner account required.</p><button id="run">Start import</button><pre id="log" role="status"></pre><script>
const button=document.getElementById('run'),log=document.getElementById('log');
async function upload(payload){for(let attempt=0;attempt<4;attempt++){try{const reply=await fetch('/api/game/content-sync',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload)});const message=await reply.text();let result;try{result=JSON.parse(message)}catch{throw new Error(`HTTP ${reply.status}`)}if(!reply.ok)throw new Error(result.error??`HTTP ${reply.status}`);return result}catch(error){if(attempt===3)throw error;await new Promise(resolve=>setTimeout(resolve,1500*(attempt+1)))}}}
button.onclick=async()=>{button.disabled=true;try{const [contentResponse,bankResponse]=await Promise.all([fetch('/data/curriculum.json?sync=religious-studies',{cache:'no-store'}),fetch('/data/questions/gcse-religious-studies.json?sync=religious-studies',{cache:'no-store'})]);if(!contentResponse.ok||!bankResponse.ok)throw new Error('Published content unavailable.');const curriculum=await contentResponse.json(),bank=await bankResponse.json();const points=curriculum.records.map((point,sequence)=>({point,sequence})).filter(({point})=>point.subject_id==='GCSE-RELIGIOUS-STUDIES');const questions=bank.filter(q=>q.question_id.startsWith('AQA8062-')&&q.question_type!=='multiple_choice');if(points.length!==64||bank.length!==1019||questions.length!==500)throw new Error(`Published counts: ${points.length} points, ${bank.length} total questions, ${questions.length} written.`);let pointOffset=Number(localStorage.getItem('memmara-religious-studies-point-offset')||0);while(pointOffset<points.length){const result=await upload({points:points.slice(pointOffset,pointOffset+20)});pointOffset+=result.processed;localStorage.setItem('memmara-religious-studies-point-offset',String(pointOffset));log.textContent=`${pointOffset}/64 curriculum points imported`;}let offset=Number(localStorage.getItem('memmara-religious-studies-sync-offset')||0);while(offset<questions.length){const result=await upload({questions:questions.slice(offset,offset+20)});offset+=result.processed;localStorage.setItem('memmara-religious-studies-sync-offset',String(offset));log.textContent=`${offset}/500 questions imported`;}log.textContent='All 64 points and 500 written questions imported.'}catch(error){log.textContent='STOPPED: '+error.message+'\n'+log.textContent}finally{button.disabled=false}};
</script></html>
