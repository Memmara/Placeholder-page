<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memmara content sync</title><style>body{font:16px system-ui;background:#0b1224;color:#eef4ff;max-width:650px;margin:10vh auto;padding:20px}button{background:#ab96ff;border:0;border-radius:12px;padding:14px 22px;font:inherit;cursor:pointer}pre{white-space:pre-wrap;line-height:1.5}</style><h1>Sync Memmara content</h1><p>Imports the four updated subject banks into PostgreSQL. Owner account required.</p><button id="run">Start import</button><pre id="log" role="status"></pre><script>
const courses=['a-level-biology','a-level-chemistry','a-level-psychology'];
const button=document.getElementById('run'),log=document.getElementById('log');
button.onclick=async()=>{button.disabled=true;try{const progress=JSON.parse(localStorage.getItem('memmara-content-sync-progress')||'{}');for(const subject of courses){if(Object.hasOwn(progress,subject)&&progress[subject]===null)continue;let offset=progress[subject]??0;while(offset!==null){let result;for(let attempt=0;attempt<4;attempt++){try{const response=await fetch('/api/game/content-sync',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({subject,offset})});const message=await response.text();try{result=JSON.parse(message)}catch{throw new Error(`HTTP ${response.status}`)}if(!response.ok)throw new Error(result.error??`HTTP ${response.status}`);break}catch(error){if(attempt===3)throw new Error(`${subject} at ${offset}: ${error.message}`);await new Promise(resolve=>setTimeout(resolve,1500*(attempt+1)))}}log.textContent=`${subject}: ${Math.min(offset+result.processed,result.total)}/${result.total}\n`+log.textContent;offset=result.nextOffset;progress[subject]=offset;localStorage.setItem('memmara-content-sync-progress',JSON.stringify(progress))}}log.textContent='All four banks synced.\n'+log.textContent}catch(error){log.textContent='STOPPED: '+error.message+'\n'+log.textContent}finally{button.disabled=false}};
</script></html>
