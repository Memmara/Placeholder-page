<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memmara definition sync</title><style>body{font:16px system-ui;background:#0b1224;color:#eef4ff;max-width:650px;margin:10vh auto;padding:20px}button{background:#ab96ff;border:0;border-radius:12px;padding:14px 22px;font:inherit;cursor:pointer}pre{white-space:pre-wrap;line-height:1.5}</style><h1>Sync definitions</h1><p>Owner account required.</p><button id="run">Start import</button><pre id="log" role="status"></pre><script>
const button=document.getElementById('run'),log=document.getElementById('log');
async function upload(payload){for(let attempt=0;attempt<4;attempt++){try{const reply=await fetch('/api/game/content-sync',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload)});const message=await reply.text();let result;try{result=JSON.parse(message)}catch{throw new Error('HTTP '+reply.status)}if(!reply.ok)throw new Error(result.error??'HTTP '+reply.status);return result}catch(error){if(attempt===3)throw error;await new Promise(resolve=>setTimeout(resolve,1500*(attempt+1)))}}}
button.onclick=async()=>{button.disabled=true;try{
 const [definitionsResponse,questionsResponse,curriculumResponse]=await Promise.all([fetch('/data/definitions.json?sync=all-definitions-v1',{cache:'no-store'}),fetch('/data/definition-questions.json?sync=all-definitions-v1',{cache:'no-store'}),fetch('/data/curriculum.json?sync=all-definitions-v1',{cache:'no-store'})]);
 if(!definitionsResponse.ok||!questionsResponse.ok||!curriculumResponse.ok)throw Error('Published content unavailable.');
 const definitions=(await definitionsResponse.json()).filter(item=>item.incorrect_definitions?.length===3);
 const questions=await questionsResponse.json(),curriculum=await curriculumResponse.json();
 if(definitions.length!==1278||questions.length!==518)throw Error('Published counts differ: '+definitions.length+' definitions, '+questions.length+' questions.');
 const ids=new Set(questions.map(q=>q.specification_point_id));
 const points=curriculum.records.map((point,sequence)=>({point,sequence})).filter(({point})=>ids.has(point.specification_point_id));
 if(new Set(points.map(({point})=>point.specification_point_id)).size!==ids.size)throw Error('Published questions have missing curriculum points.');
 for(const [kind,items] of [['points',points],['definitions',definitions],['questions',questions]]){
  const key='memmara-definition-sync-'+kind+'-v1';let offset=Number(localStorage.getItem(key)||0);
  while(offset<items.length){const result=await upload({[kind]:items.slice(offset,offset+20)});offset+=result.processed;localStorage.setItem(key,String(offset));log.textContent=kind+': '+offset+'/'+items.length+' imported.';}
 }
 log.textContent='Complete: '+definitions.length+' definitions and '+questions.length+' questions imported.';
}catch(error){log.textContent='STOPPED: '+error.message+'\n'+log.textContent}finally{button.disabled=false}};
</script></html>
